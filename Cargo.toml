[package]
name = "january-ai"
version = "0.1.1"
edition = "2024"
description = "Unofficial Rust SDK for January AI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/n3mu3lw/january-ai"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229",  features = ["derive"]}
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
wiremock = "0.6.5"
